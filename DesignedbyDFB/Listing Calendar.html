<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Designed by DFB — Listing Calendar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Jost:wght@400;500;600&display=swap');

  :root {
    --bg: #292320;
    --cream: #f5eddf;
    --gold: #c9a96e;
    --rose: var(--sage);
    --border: #ead9d5;
    --light-bg: #fdf7f2;
    --mid-text: #5a4a45;
    --muted: #998f89;
    --muted-onbg: #c4b0a8;
    --warn: #b3453f;
    --page-bg: #000000;
    --card-bg: #ffffff;
    --mauve: #b7879f;
    --mauve-dark: #966780;
    --sage: #aec4b2;
    --sage-dark: #8fac96;
    --sage-tint: #eef3ef;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--cream);
    font-family: 'Jost', sans-serif;
    padding: 32px 20px 60px;
  }

  .wrap { max-width: 880px; margin: 0 auto; }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    color: var(--mauve);
    margin: 0 0 4px;
    letter-spacing: 0.3px;
  }

  .subhead { color: var(--muted-onbg); font-size: 14px; margin-bottom: 24px; }

  .card {
    position: relative;
    overflow: hidden;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 24px;
    color: var(--mid-text);
    box-shadow: 0 3px 16px rgba(42,31,28,0.07);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 60px; height: 4px;
    background: var(--rose);
  }

  .card h2 {
    font-family: 'Playfair Display', serif;
    color: var(--bg);
    font-size: 19px;
    margin: 0 0 14px;
    display: flex; align-items: center; gap: 8px;
  }

  .step-tag {
    font-size: 11px; background: var(--mauve); color: #fff;
    padding: 2px 8px; border-radius: 20px; font-weight: 600;
  }

  .hint { font-size: 12px; color: var(--muted); margin-top: -2px; margin-bottom: 6px; }

  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--bg); margin: 14px 0 6px; }
  label.first { margin-top: 0; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--mauve); color: #fff; border: none;
    padding: 11px 22px; border-radius: 8px; font-family: 'Jost', sans-serif;
    font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 16px;
  }
  .btn:hover { background: var(--mauve-dark); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn.secondary {
    background: var(--sage); color: var(--bg); border: 1.5px solid var(--sage);
    padding: 7px 14px; font-size: 12px; margin-top: 0;
  }
  .btn.secondary:hover { border-color: var(--sage-dark); background: var(--sage-dark); color: #fff; }
  .btn.small { padding: 8px 14px; font-size: 12.5px; margin-top: 0; }

  .copy-all-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

  .streak-row {
    background: var(--rose); color: #fff; border-radius: 10px; padding: 10px 16px;
    font-size: 13.5px; font-weight: 600; margin: 14px 0 20px; display: inline-block;
  }

  .cal-header { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 14px; }
  .cal-month-label { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--bg); font-weight: 700; }

  .cal-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 16px; font-size: 12px; color: var(--mid-text); }
  .cal-legend-item { display: flex; align-items: center; gap: 6px; }
  .cal-legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .cal-daylabel { text-align: center; font-size: 11px; color: var(--muted); font-weight: 600; padding-bottom: 4px; }
  .cal-cell {
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    min-height: 92px; padding: 8px; cursor: pointer; display: flex; flex-direction: column;
    gap: 4px; transition: border-color 0.15s ease;
  }
  .cal-cell:hover { border-color: var(--rose); }
  .cal-cell.empty { background: transparent; border: none; cursor: default; }
  .cal-cell.today { border-color: var(--rose); border-width: 2px; }
  .cal-cell .cal-date { font-size: 12.5px; font-weight: 600; color: var(--mid-text); }
  .cal-cell .cal-count { font-size: 10.5px; color: #9a877f; }
  .cal-cell .cal-types { display: flex; flex-direction: column; gap: 3px; margin-top: 2px; }
  .cal-type-label {
    font-size: 10px; font-weight: 600; color: #fff; padding: 2px 6px; border-radius: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.5;
  }

  .count-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .count-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--border);
    background: #fff; color: var(--mid-text); font-family: 'Jost', sans-serif;
    font-weight: 600; cursor: pointer; font-size: 13.5px;
  }
  .count-btn:hover { border-color: var(--rose); }
  .count-btn.active { background: var(--rose); border-color: var(--rose); color: #fff; }

  .type-multiselect { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .type-ms-chip {
    padding: 9px 16px; border-radius: 20px; border: 1.5px solid var(--border);
    background: #fff; font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: 'Jost', sans-serif; color: var(--mid-text); display: flex;
    align-items: center; gap: 7px; transition: all 0.15s ease;
  }
  .type-ms-chip .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .type-ms-chip.active { color: #fff; border-color: transparent; }

  .stats-total { font-size: 15px; font-weight: 700; color: var(--bg); margin-bottom: 16px; }
  .stats-bars { display: flex; flex-direction: column; gap: 12px; }
  .stats-bar-row { display: flex; flex-direction: column; gap: 4px; }
  .stats-bar-label { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--mid-text); font-weight: 600; }
  .stats-bar-track { background: var(--sage-tint); border-radius: 20px; height: 10px; overflow: hidden; }
  .stats-bar-fill { height: 100%; border-radius: 20px; transition: width 0.3s ease; }

  .type-count-list { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .type-count-row { display: flex; align-items: center; gap: 10px; }
  .type-count-row .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .type-count-row .type-name { flex: 1; font-size: 13.5px; color: var(--mid-text); font-weight: 500; }
  .type-count-controls { display: flex; align-items: center; gap: 6px; }
  .stepper-btn {
    width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--border);
    background: #fff; color: var(--mid-text); font-size: 15px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .stepper-btn:hover { border-color: var(--rose); background: var(--sage-tint); }
  .type-count-value { width: 30px; text-align: center; font-size: 14px; font-weight: 700; color: var(--bg); }
  .day-total { font-size: 13.5px; font-weight: 700; color: var(--bg); margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Listing Calendar</h1>
  <div class="subhead">Log how many listings you added each day and which product types, so you can spot gaps and stay consistent.</div>

  <div class="card">
    <h2><span class="step-tag">Consistency</span> This Month</h2>
    <div class="hint">Saves automatically in this browser as you go.</div>

    <div class="streak-row" id="streakRow"></div>

    <div class="cal-header">
      <button class="btn secondary small" id="calPrevBtn">‹ Prev</button>
      <div class="cal-month-label" id="calMonthLabel"></div>
      <button class="btn secondary small" id="calNextBtn">Next ›</button>
    </div>

    <div class="cal-legend" id="calLegend"></div>

    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="card">
    <h2><span class="step-tag">Snapshot</span> <span id="statsMonthLabel"></span></h2>
    <div class="stats-total" id="statsTotal"></div>
    <div class="stats-bars" id="statsBars"></div>
  </div>

  <div class="card" id="dayEditorCard" style="display:none;">
    <h2><span class="step-tag">Edit Day</span> <span id="dayEditorDate"></span></h2>

    <label class="first">How many of each type did you add?</label>
    <div class="type-count-list" id="typeCountList"></div>
    <div class="day-total" id="dayTotal">Total: 0 listings</div>

    <div class="copy-all-row">
      <button class="btn" id="saveDayBtn">Save Day</button>
      <button class="btn secondary" id="deleteDayBtn">Delete Entry</button>
      <button class="btn secondary" id="closeDayEditorBtn">Close</button>
    </div>
  </div>
</div>

<script>
const storageAPI = {
  async get(key) {
    if (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function') {
      try { return await window.storage.get(key); } catch (e) { return null; }
    }
    try {
      const val = localStorage.getItem('shopbuilder:' + key);
      return val !== null ? { key, value: val } : null;
    } catch (e) { return null; }
  },
  async set(key, value) {
    if (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.set === 'function') {
      try { return await window.storage.set(key, value); } catch (e) { return null; }
    }
    try {
      localStorage.setItem('shopbuilder:' + key, value);
      return { key, value };
    } catch (e) { return null; }
  }
};

const PRODUCT_TYPES = [
  { name: 'Glass Tumbler Wrap', color: '#c9a96e' },
  { name: 'Laser Wrap', color: '#8a9bb0' },
  { name: 'PNG', color: '#b98a9e' },
  { name: 'Tumbler Wrap', color: '#8fa88f' }
];

let calendarEntries = {};
let calViewDate = new Date();
calViewDate.setDate(1);
let selectedDayKey = null;
let calendarLoaded = false;

function dateKey(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
function todayKey() {
  const t = new Date();
  return dateKey(t.getFullYear(), t.getMonth(), t.getDate());
}

async function loadCalendarEntries() {
  try {
    const result = await storageAPI.get('calendar:entries');
    if (result && result.value) {
      calendarEntries = JSON.parse(result.value);
    } else if (!calendarLoaded) {
      calendarEntries = {};
    }
  } catch (e) {
    if (!calendarLoaded) calendarEntries = {};
  }
  calendarLoaded = true;
  setCalSaveStatus('');
}

async function saveCalendarEntries() {
  try {
    await storageAPI.set('calendar:entries', JSON.stringify(calendarEntries));
    setCalSaveStatus('Saved just now');
  } catch (e) {
    setCalSaveStatus('Could not save — use Save Backup File to be safe');
  }
}

function setCalSaveStatus(msg) {
  const el = document.getElementById('calSaveStatus');
  if (el) el.textContent = msg;
}

function renderCalLegend() {
  const el = document.getElementById('calLegend');
  el.innerHTML = PRODUCT_TYPES.map(t =>
    `<span class="cal-legend-item"><span class="cal-legend-dot" style="background:${t.color}"></span>${t.name}</span>`
  ).join('');
}

function renderCalendarMonth() {
  const year = calViewDate.getFullYear();
  const month = calViewDate.getMonth();
  document.getElementById('calMonthLabel').textContent = calViewDate.toLocaleDateString([], { month: 'long', year: 'numeric' });

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(d => {
    const label = document.createElement('div');
    label.className = 'cal-daylabel';
    label.textContent = d;
    grid.appendChild(label);
  });

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const tKey = todayKey();

  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement('div');
    empty.className = 'cal-cell empty';
    grid.appendChild(empty);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const key = dateKey(year, month, d);
    const entry = calendarEntries[key];
    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (key === tKey ? ' today' : '');
    const typesHtml = (entry && entry.types && entry.types.length)
      ? `<div class="cal-types">${entry.types.map(tn => {
          const pt = PRODUCT_TYPES.find(p => p.name === tn);
          return `<span class="cal-type-label" style="background:${pt ? pt.color : '#999'}">${tn}</span>`;
        }).join('')}</div>`
      : '';
    cell.innerHTML = `<span class="cal-date">${d}</span>${entry ? `<span class="cal-count">${entry.count} listing${entry.count === 1 ? '' : 's'}</span>` : ''}${typesHtml}`;
    cell.addEventListener('click', () => openDayEditor(key, d, month, year));
    grid.appendChild(cell);
  }

  renderMonthlyStats(year, month);
}

function computeMonthlyStats(year, month) {
  const prefix = `${year}-${String(month + 1).padStart(2, '0')}-`;
  const byType = {};
  PRODUCT_TYPES.forEach(t => { byType[t.name] = 0; });
  let total = 0;
  Object.keys(calendarEntries).forEach((key) => {
    if (!key.startsWith(prefix)) return;
    const entry = calendarEntries[key];
    if (!entry) return;
    total += entry.count || 0;
    if (entry.byType) {
      PRODUCT_TYPES.forEach(t => { byType[t.name] += entry.byType[t.name] || 0; });
    }
  });
  return { total, byType };
}

function renderMonthlyStats(year, month) {
  const { total, byType } = computeMonthlyStats(year, month);
  const monthLabel = new Date(year, month, 1).toLocaleDateString([], { month: 'long', year: 'numeric' });
  document.getElementById('statsMonthLabel').textContent = monthLabel;
  document.getElementById('statsTotal').textContent = `${total} listing${total === 1 ? '' : 's'} added so far`;

  const maxCount = Math.max(1, ...PRODUCT_TYPES.map(t => byType[t.name]));
  const bars = document.getElementById('statsBars');
  bars.innerHTML = PRODUCT_TYPES.map(t => {
    const count = byType[t.name];
    const pct = count > 0 ? Math.max(4, Math.round((count / maxCount) * 100)) : 0;
    return `
      <div class="stats-bar-row">
        <div class="stats-bar-label"><span>${t.name}</span><span>${count}</span></div>
        <div class="stats-bar-track"><div class="stats-bar-fill" style="width:${pct}%; background:${t.color};"></div></div>
      </div>`;
  }).join('');
}

let dayTypeCounts = {};

function openDayEditor(key, d, month, year) {
  selectedDayKey = key;
  const entry = calendarEntries[key];
  dayTypeCounts = {};
  PRODUCT_TYPES.forEach(t => { dayTypeCounts[t.name] = (entry && entry.byType) ? (entry.byType[t.name] || 0) : 0; });

  const dateObj = new Date(year, month, d);
  document.getElementById('dayEditorDate').textContent = dateObj.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

  renderTypeCountList();

  const editorCard = document.getElementById('dayEditorCard');
  editorCard.style.display = 'block';
  editorCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function renderTypeCountList() {
  const list = document.getElementById('typeCountList');
  list.innerHTML = '';
  PRODUCT_TYPES.forEach(t => {
    const row = document.createElement('div');
    row.className = 'type-count-row';

    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = t.color;
    row.appendChild(dot);

    const name = document.createElement('span');
    name.className = 'type-name';
    name.textContent = t.name;
    row.appendChild(name);

    const controls = document.createElement('div');
    controls.className = 'type-count-controls';

    const minusBtn = document.createElement('button');
    minusBtn.className = 'stepper-btn';
    minusBtn.textContent = '−';
    minusBtn.addEventListener('click', () => {
      dayTypeCounts[t.name] = Math.max(0, dayTypeCounts[t.name] - 1);
      renderTypeCountList();
      updateDayTotal();
    });
    controls.appendChild(minusBtn);

    const value = document.createElement('span');
    value.className = 'type-count-value';
    value.textContent = dayTypeCounts[t.name];
    controls.appendChild(value);

    const plusBtn = document.createElement('button');
    plusBtn.className = 'stepper-btn';
    plusBtn.textContent = '+';
    plusBtn.addEventListener('click', () => {
      dayTypeCounts[t.name] += 1;
      renderTypeCountList();
      updateDayTotal();
    });
    controls.appendChild(plusBtn);

    row.appendChild(controls);
    list.appendChild(row);
  });
  updateDayTotal();
}

function updateDayTotal() {
  const total = PRODUCT_TYPES.reduce((sum, t) => sum + dayTypeCounts[t.name], 0);
  document.getElementById('dayTotal').textContent = `Total: ${total} listing${total === 1 ? '' : 's'}`;
}

document.getElementById('saveDayBtn').addEventListener('click', async () => {
  if (!selectedDayKey) return;
  const total = PRODUCT_TYPES.reduce((sum, t) => sum + dayTypeCounts[t.name], 0);
  if (!total) {
    setCalSaveStatus('Add at least one listing first');
    setTimeout(() => setCalSaveStatus(''), 2000);
    return;
  }
  const byType = {};
  PRODUCT_TYPES.forEach(t => { if (dayTypeCounts[t.name] > 0) byType[t.name] = dayTypeCounts[t.name]; });
  calendarEntries[selectedDayKey] = {
    count: total,
    types: Object.keys(byType),
    byType
  };
  await saveCalendarEntries();
  renderCalendarMonth();
  renderStreak();
  closeDayEditor();
});

document.getElementById('deleteDayBtn').addEventListener('click', async () => {
  if (!selectedDayKey) return;
  delete calendarEntries[selectedDayKey];
  await saveCalendarEntries();
  renderCalendarMonth();
  renderStreak();
  closeDayEditor();
});

function closeDayEditor() {
  document.getElementById('dayEditorCard').style.display = 'none';
  selectedDayKey = null;
}

document.getElementById('closeDayEditorBtn').addEventListener('click', closeDayEditor);

document.getElementById('calPrevBtn').addEventListener('click', () => {
  calViewDate.setMonth(calViewDate.getMonth() - 1);
  renderCalendarMonth();
});

document.getElementById('calNextBtn').addEventListener('click', () => {
  calViewDate.setMonth(calViewDate.getMonth() + 1);
  renderCalendarMonth();
});

function renderStreak() {
  const el = document.getElementById('streakRow');
  let streak = 0;
  let cursor = new Date();
  while (true) {
    const key = dateKey(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
    const entry = calendarEntries[key];
    if (entry && entry.count > 0) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    } else {
      break;
    }
  }
  el.textContent = streak > 0
    ? `🔥 ${streak} day streak, keep it going`
    : 'No listing logged for today yet, add one to start a streak';
}

renderCalLegend();
(async function init() {
  await loadCalendarEntries();
  renderCalendarMonth();
  renderStreak();
})();
</script>
</body>
</html>
