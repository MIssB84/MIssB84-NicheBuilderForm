<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Treatment & Injury Update Builder</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fdf7f2;
    margin: 0;
    padding: 24px;
    color: #2a1f1c;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; color: #2a1f1c; }
  .sub { color: #5a4a45; font-size: 13px; margin-bottom: 20px; }
  .card {
    background: #fff;
    border: 1px solid #ead9d5;
    border-radius: 8px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .required-mark { color: #b33; font-weight: normal; }
  label {
    display: block;
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 6px;
    color: #2a1f1c;
  }
  input[type="text"], input[type="number"], textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #ead9d5;
    border-radius: 5px;
    font-size: 14px;
    font-family: inherit;
    color: #2a1f1c;
  }
  textarea { resize: vertical; min-height: 70px; }
  .radio-row, .check-row {
    display: flex;
    gap: 16px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .radio-row label, .check-row label {
    font-weight: normal;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 0;
    cursor: pointer;
  }
  .bullet-add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .bullet-add-row input { flex: 1; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 5px;
    font-size: 13px;
    padding: 8px 14px;
    font-weight: bold;
  }
  .btn-add { background: #dea193; color: #2a1f1c; }
  .btn-add-claimant { background: #2a1f1c; color: #f5eddf; width: 100%; padding: 10px; margin-top: 4px; }
  .bullet-list { list-style: disc; margin: 0 0 6px 20px; padding: 0; }
  .bullet-list li { margin-bottom: 4px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bullet-list li .remove { color: #b33; cursor: pointer; font-size: 12px; font-weight: bold; }
  .stack > div { margin-bottom: 14px; }
  .stack > div:last-child { margin-bottom: 0; }
  .generate-btn {
    background: #dea193;
    color: #2a1f1c;
    width: 100%;
    padding: 14px;
    font-size: 15px;
    margin-top: 6px;
  }
  .output-box {
    white-space: pre-wrap;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    min-height: 120px;
    color: #2a1f1c;
  }
  .copy-btn { background: #2a1f1c; color: #f5eddf; margin-top: 10px; }
  .followup-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .followup-row label.inline { font-weight: normal; display: flex; align-items: center; gap: 8px; margin-bottom: 0; }
  .followup-row input[type="number"] { width: 70px; }
  .error-msg { color: #b33; font-size: 13px; margin-top: 8px; display: none; }
  .claimant-card { border: 1px solid #dea193; position: relative; }
  .claimant-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .claimant-header label { margin-bottom: 0; }
  .remove-claimant { color: #b33; cursor: pointer; font-size: 12px; font-weight: bold; }
  .claimant-card > label { margin-top: 14px; }
  .claimant-card > label:first-of-type { margin-top: 0; }
  .section-title { font-size: 16px; font-weight: bold; margin: 4px 0 8px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Treatment & Injury Update Builder</h1>
  <div class="sub">Fill in what applies. Anything left blank won't show in the output.</div>

  <div class="card">
    <label>Contact Result <span class="required-mark">*required</span></label>
    <div class="radio-row">
      <label><input type="radio" name="contactResult" value="Spoke with"> Spoke with</label>
      <label><input type="radio" name="contactResult" value="Left message for"> Left message for</label>
      <label><input type="radio" name="contactResult" value="Left voicemail for"> Left voicemail for</label>
    </div>
    <label>Name <span class="required-mark">*required</span></label>
    <input type="text" id="contactName" placeholder="Name of person">
  </div>

  <div class="section-title">Claimants</div>
  <div id="claimantsContainer"></div>
  <button class="btn-add-claimant" onclick="addClaimant()">+ Add Claimant</button>

  <div class="card stack" style="margin-top:16px;">
    <div>
      <label>PD/MOI</label>
      <input type="text" id="pdmoi">
    </div>
    <div>
      <label>FYI/Notes</label>
      <input type="text" id="fyiNotes" placeholder="Shows on output">
    </div>
  </div>

  <div class="card">
    <label>Notes (for you only, not on output)</label>
    <textarea id="rawNotes" placeholder="Quick raw notes, clean up later"></textarea>
  </div>

  <div class="card">
    <label>Follow Up</label>
    <div class="followup-row">
      <label class="inline"><input type="checkbox" id="followupToggle" checked> Include follow up line</label>
      <span>in</span>
      <input type="number" id="followupDays" value="60" min="1">
      <span>days</span>
    </div>
  </div>

  <button class="generate-btn" onclick="generateOutput()">Generate Update</button>
  <div class="error-msg" id="errorMsg">Please select a contact result and enter a name before generating.</div>

  <div class="card" style="margin-top:16px;">
    <label>Output</label>
    <div class="output-box" id="output">Fill out the form and click Generate.</div>
    <button class="copy-btn" onclick="copyOutput()">Copy to Clipboard</button>
  </div>
</div>

<script>
  const specialWords = { pm: 'Pain Management', er: 'ER', ems: 'EMS' };
  const claimants = {};
  let claimantCounter = 0;

  function smartCase(str) {
    return str
      .toLowerCase()
      .split(' ')
      .filter(w => w.length)
      .map(w => specialWords[w] ? specialWords[w] : w.charAt(0).toUpperCase() + w.slice(1))
      .join(' ');
  }

  function addClaimant() {
    claimantCounter++;
    const id = 'claimant' + claimantCounter;
    claimants[id] = { injuries: [], treatment: [] };

    const div = document.createElement('div');
    div.className = 'card claimant-card';
    div.id = id;
    div.innerHTML = `
      <div class="claimant-header">
        <label>Claimant Name</label>
        <span class="remove-claimant" onclick="removeClaimant('${id}')">remove claimant</span>
      </div>
      <input type="text" class="claimantName" placeholder="Claimant name">

      <label>Injuries</label>
      <div class="bullet-add-row">
        <input type="text" class="bulletInput" data-type="injuries" placeholder="Type an injury, then Add">
        <button class="btn-add" onclick="addClaimantBullet('${id}','injuries')">Add</button>
      </div>
      <ul class="bullet-list bulletList" data-type="injuries"></ul>

      <label>Treatment</label>
      <div class="bullet-add-row">
        <input type="text" class="bulletInput" data-type="treatment" placeholder="Type a treatment item, then Add">
        <button class="btn-add" onclick="addClaimantBullet('${id}','treatment')">Add</button>
      </div>
      <ul class="bullet-list bulletList" data-type="treatment"></ul>

      <label>ISO Needed</label>
      <div class="check-row">
        <label><input type="checkbox" class="isoCheck" value="SSN"> SSN</label>
        <label><input type="checkbox" class="isoCheck" value="DOB"> DOB</label>
        <label><input type="checkbox" class="isoCheck" value="Gender"> Gender</label>
        <label><input type="checkbox" class="isoCheck" value="Address"> Address</label>
      </div>

      <label>Health Insurance</label>
      <div class="check-row">
        <label><input type="checkbox" class="medicareCheck"> Medicare</label>
        <label><input type="checkbox" class="medicaidCheck"> Medicaid</label>
      </div>
      <input type="text" class="healthInsOther" placeholder="Other insurance (optional)">
    `;
    document.getElementById('claimantsContainer').appendChild(div);

    div.querySelectorAll('.bulletInput').forEach(inp => {
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); addClaimantBullet(id, inp.dataset.type); }
      });
    });
  }

  function removeClaimant(id) {
    delete claimants[id];
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function addClaimantBullet(id, type) {
    const div = document.getElementById(id);
    const input = div.querySelector(`.bulletInput[data-type="${type}"]`);
    const val = input.value.trim();
    if (!val) return;
    claimants[id][type].push(smartCase(val));
    input.value = '';
    renderClaimantBullets(id, type);
    input.focus();
  }

  function removeClaimantBullet(id, type, idx) {
    claimants[id][type].splice(idx, 1);
    renderClaimantBullets(id, type);
  }

  function renderClaimantBullets(id, type) {
    const div = document.getElementById(id);
    const list = div.querySelector(`.bulletList[data-type="${type}"]`);
    list.innerHTML = '';
    claimants[id][type].forEach((item, idx) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${item}</span><span class="remove" onclick="removeClaimantBullet('${id}','${type}',${idx})">remove</span>`;
      list.appendChild(li);
    });
  }

  // start with one claimant block by default
  addClaimant();

  function generateOutput() {
    const contactResultEl = document.querySelector('input[name="contactResult"]:checked');
    const contactResult = contactResultEl ? contactResultEl.value : '';
    const contactNameRaw = document.getElementById('contactName').value.trim();
    const contactName = contactNameRaw ? smartCase(contactNameRaw) : '';

    const errorMsg = document.getElementById('errorMsg');
    if (!contactResult || !contactName) {
      errorMsg.style.display = 'block';
      return;
    }
    errorMsg.style.display = 'none';

    const pdmoi = document.getElementById('pdmoi').value.trim();
    const fyiNotes = document.getElementById('fyiNotes').value.trim();
    const followup = document.getElementById('followupToggle').checked;
    const followupDays = document.getElementById('followupDays').value || '60';

    let lines = [];

    lines.push('Called to obtain treatment and injury update; and ask if the atty has any info they can provide now, so we may work toward possible early resolution.');
    lines.push('');
    lines.push(`${contactResult} ${contactName}.`);

    Object.keys(claimants).forEach(id => {
      const div = document.getElementById(id);
      if (!div) return;
      const nameRaw = div.querySelector('.claimantName').value.trim();
      const name = nameRaw ? smartCase(nameRaw) : 'Claimant';
      const injuries = claimants[id].injuries;
      const treatment = claimants[id].treatment;
      const isoItems = Array.from(div.querySelectorAll('.isoCheck:checked')).map(c => c.value);
      const healthInsItems = [];
      if (div.querySelector('.medicareCheck').checked) healthInsItems.push('Medicare');
      if (div.querySelector('.medicaidCheck').checked) healthInsItems.push('Medicaid');
      const otherIns = div.querySelector('.healthInsOther').value.trim();
      if (otherIns) healthInsItems.push(smartCase(otherIns));

      const hasContent = injuries.length || treatment.length || isoItems.length || healthInsItems.length;
      if (!hasContent) return;

      lines.push('');
      lines.push(`${name}:`);

      if (injuries.length) {
        lines.push('Injuries:');
        injuries.forEach(b => lines.push('- ' + b));
      }
      if (treatment.length) {
        lines.push('Treatment:');
        treatment.forEach(b => lines.push('- ' + b));
      }
      if (healthInsItems.length) lines.push('Health Insurance: ' + healthInsItems.join(', '));
      if (isoItems.length) lines.push('ISO Needed: ' + isoItems.join(', '));
    });

    if (pdmoi) { lines.push(''); lines.push('PD/MOI: ' + pdmoi); }
    if (fyiNotes) { lines.push(''); lines.push('FYI/Notes: ' + fyiNotes); }

    if (followup) {
      lines.push('');
      lines.push(`Will follow up in ${followupDays} days.`);
    }

    document.getElementById('output').innerText = lines.join('\n');
  }

  async function copyOutput() {
    const text = document.getElementById('output').innerText;
    const crlfText = text.replace(/\n/g, '\r\n');
    const htmlText = text.split('\n').map(l => l === '' ? '<br>' : l).join('<br>');

    try {
      const item = new ClipboardItem({
        'text/plain': new Blob([crlfText], { type: 'text/plain' }),
        'text/html': new Blob([htmlText], { type: 'text/html' })
      });
      await navigator.clipboard.write([item]);
    } catch (e) {
      await navigator.clipboard.writeText(crlfText);
    }

    const btn = document.querySelector('.copy-btn');
    const orig = btn.innerText;
    btn.innerText = 'Copied!';
    setTimeout(() => btn.innerText = orig, 1200);
  }
</script>
</body>
</html>
